name: CD - Release

on:
  push:
    tags:
      - 'v*' # Capture v1.0.0, v1.1.0-dev.1, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync

      - name: Generate Resumes
        run: |
          mkdir -p dist
          uv run python main.py
        env:
          TEMPLATE_SOURCE: "local"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.docx
          name: "Resume Release ${{ github.ref_name }}"
          # La magie est ici :
          # Si le tag contient '-dev', GitHub marquera la release comme "Pre-release"
          prerelease: ${{ contains(github.ref, '-dev') }}
          generate_release_notes: true
          body: |
            ## 📄 Generated Resumes - Version ${{ github.ref_name }}
            ${{ contains(github.ref, '-dev') && '> ⚠️ **Ceci est une version de développement.**' || '> ✅ **Version stable.**' }}

            ---
            *Generated by CD workflow.*
