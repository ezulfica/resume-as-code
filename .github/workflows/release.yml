name: CD - Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.1.0, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release and upload assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Generate Resumes
        run: |
          mkdir -p dist
          uv run python main.py
        env:
          # Forces local template mode for the CI/CD environment
          TEMPLATE_SOURCE: "local"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.docx
          name: "Resume Release ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 📄 Generated Resumes - Version ${{ github.ref_name }}

            Automated generation of resumes in Word format (.docx).

            ---
            *Generated by CD workflow (local mode).*
