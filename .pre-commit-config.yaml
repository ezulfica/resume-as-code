repos:
  # --- 1. CODE QUALITY ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- 2. YAML VALIDATION ---
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, "{extends: default, rules: {line-length: disable}}"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml      # Verifies YAML syntax
      - id: check-added-large-files
        args: ['--maxkb=1024'] # Increase limit to 1MB
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # --- 3. COMMIT POLICY (Conventional Commits) ---
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["feat", "fix", "ci", "content", "refactor", "chore", "docs", "test"]

  # --- 4. PRE-PUSH SECURITY ---
  - repo: local
    hooks:
      - id: pytest-check
        name: Pytest Check
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [push]
